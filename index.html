
<!DOCTYPE html>
<html lang="ar" dir="auto">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Platform Zikir Digital</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #1e40af;
            --secondary: #3b82f6;
            --accent: #60a5fa;
            --background: #f0f7ff;
            --text: #1e293b;
        }
        
        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--background);
            color: var(--text);
        }
        
        .arabic-text {
            font-family: 'Amiri', serif;
            line-height: 1.8;
        }
        
        .tasbih-container {
            background: linear-gradient(135deg, #e0f2fe, #dbeafe);
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(30, 64, 175, 0.15);
        }
        
        .tasbih-button {
            background: linear-gradient(135deg, #1e40af, #3b82f6);
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
            transition: all 0.3s ease;
        }
        
        .tasbih-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4);
        }
        
        .tasbih-button:active {
            transform: translateY(1px);
        }
        
        .control-button {
            transition: all 0.2s ease;
        }
        
        .control-button:hover {
            transform: translateY(-1px);
        }
        
        .control-button:active {
            transform: translateY(1px);
        }
        
        .zikir-item {
            transition: all 0.3s ease;
        }
        
        .zikir-item:hover {
            background-color: #dbeafe;
        }
        
        .zikir-active {
            background-color: #bfdbfe;
            border-left: 4px solid #3b82f6;
        }
        
        .social-icon {
            transition: all 0.3s ease;
        }
        
        .social-icon:hover {
            transform: translateY(-3px);
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        
        .pulse {
            animation: pulse 0.5s ease-in-out;
        }
        
        .completed {
            background: linear-gradient(135deg, #15803d, #22c55e);
        }
        
        .history-item {
            transition: all 0.2s ease;
        }
        
        .history-item:hover {
            background-color: #dbeafe;
        }
        
        .tab-active {
            border-bottom: 3px solid var(--primary);
            color: var(--primary);
            font-weight: 600;
        }
        
        .rtl {
            direction: rtl;
        }
        
        .ltr {
            direction: ltr;
        }
        
        .slide-down {
            animation: slideDown 0.3s ease-in-out;
        }
        
        .slide-up {
            animation: slideUp 0.3s ease-in-out;
        }
        
        @keyframes slideDown {
            from { max-height: 0; opacity: 0; }
            to { max-height: 500px; opacity: 1; }
        }
        
        @keyframes slideUp {
            from { max-height: 500px; opacity: 1; }
            to { max-height: 0; opacity: 0; }
        }
        
        .action-buttons {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.25rem;
        }
        
        .action-button {
            padding: 0.25rem 0.5rem;
            border-radius: 0.25rem;
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }
        
        .action-button:hover {
            transform: translateY(-1px);
        }
    </style>
</head>
<body class="min-h-screen">
    <div class="container mx-auto px-4 py-8 max-w-6xl">
        <header class="flex justify-between items-center mb-8">
            <div class="flex items-center">
                <i class="fas fa-prayer-beads text-4xl text-primary mr-3 text-blue-700"></i>
                <h1 class="text-3xl font-bold text-blue-800">Platform Zikir Digital</h1>
            </div>
            <div class="flex space-x-2">
                <button id="tab-zikir" class="px-4 py-2 tab-active">
                    <i class="fas fa-prayer-beads mr-2"></i>Zikir
                </button>
                <button id="tab-history" class="px-4 py-2">
                    <i class="fas fa-history mr-2"></i>Sejarah
                </button>
            </div>
        </header>

        <div id="zikir-tab" class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Zikir List Panel -->
            <div class="bg-white rounded-lg shadow-lg p-4 lg:col-span-1">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-semibold text-blue-800">
                        <i class="fas fa-list-ul mr-2"></i>Senarai Zikir
                    </h2>
                    <div class="flex space-x-2">

                        </button>
                        <button id="add-zikir-btn" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1 rounded-full flex items-center">
                            <i class="fas fa-plus mr-1"></i> Tambah
                        </button>
                    </div>
                </div>
                
                <div class="mb-4">
                    <div class="relative">
                        <input type="text" id="search-zikir" placeholder="Cari zikir..." class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <i class="fas fa-search absolute right-3 top-3 text-gray-400"></i>
                    </div>
                </div>
                
                <div id="zikir-list-container">
                    <div id="zikir-list" class="overflow-y-auto max-h-[500px]">
                        <!-- Zikir items will be added here dynamically -->
                    </div>
                </div>
            </div>
            
            <!-- Tasbih Counter Panel -->
            <div class="tasbih-container p-6 lg:col-span-2">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-bold text-blue-800" id="current-zikir-title">Pilih Zikir</h2>
                    <div class="flex space-x-2">
                        <button id="start-zikir-btn" class="control-button bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg flex items-center disabled:opacity-50 disabled:cursor-not-allowed">
                            <i class="fas fa-play mr-2"></i> Mulakan
                        </button>
                        <button id="set-target-btn" class="control-button bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg flex items-center">
                            <i class="fas fa-bullseye mr-2"></i> Set Bilangan
                        </button>
                    </div>
                </div>
                
                <div class="bg-white rounded-xl p-6 mb-6 shadow-md">
                    <div id="zikir-text" class="arabic-text text-center text-2xl mb-4 min-h-[100px] flex items-center justify-center">
                        <p class="text-gray-500">Sila pilih zikir dari senarai</p>
                    </div>
                    
                    <div class="flex justify-center items-center space-x-4 mb-6">
                        <div class="text-center">
                            <p class="text-sm text-gray-600">Bilangan</p>
                            <div class="flex items-center justify-center">
                                <span id="counter" class="text-4xl font-bold text-blue-800">0</span>
                                <span class="mx-2 text-xl text-gray-400">/</span>
                                <span id="target-counter" class="text-2xl font-semibold text-gray-600">33</span>
                            </div>
                        </div>
                    </div>
                    
                    <div class="flex justify-center">
                        <button id="tasbih-btn" class="tasbih-button w-48 h-48 rounded-full flex items-center justify-center text-white text-5xl disabled:opacity-50 disabled:cursor-not-allowed">
                            <i class="fas fa-hand-point-up"></i>
                        </button>
                    </div>
                </div>
                
                <div class="flex justify-center">
                    <button id="undo-btn" class="control-button bg-yellow-500 hover:bg-yellow-600 text-white px-4 py-2 rounded-lg flex items-center disabled:opacity-50 disabled:cursor-not-allowed">
                        <i class="fas fa-undo mr-2"></i> Undur
                    </button>
                </div>
            </div>
        </div>
        
        <!-- History Tab -->
        <div id="history-tab" class="hidden">
            <div class="bg-white rounded-lg shadow-lg p-6">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-bold text-blue-800">
                        <i class="fas fa-history mr-2"></i>Sejarah Zikir
                    </h2>
                    <div class="flex space-x-2">
                        <button id="export-history-btn" class="control-button bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg flex items-center">
                            <i class="fas fa-file-export mr-2"></i> Export ke Excel
                        </button>
                        <button id="clear-history-btn" class="control-button bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg flex items-center">
                            <i class="fas fa-trash-alt mr-2"></i> Padam Semua
                        </button>
                    </div>
                </div>
                
                <div class="overflow-x-auto">
                    <table class="min-w-full bg-white">
                        <thead>
                            <tr class="bg-blue-100 text-blue-800">
                                <th class="py-3 px-4 text-left">Tarikh & Masa</th>
                                <th class="py-3 px-4 text-left">Zikir</th>
                                <th class="py-3 px-4 text-left">Bilangan</th>
                                <th class="py-3 px-4 text-left">Tindakan</th>
                            </tr>
                        </thead>
                        <tbody id="history-list">
                            <!-- History items will be added here dynamically -->
                        </tbody>
                    </table>
                </div>
                
                <div id="no-history" class="text-center py-8 text-gray-500">
                    <i class="fas fa-history text-5xl mb-3"></i>
                    <p>Tiada sejarah zikir setakat ini</p>
                </div>
            </div>
        </div>
        
        <footer class="mt-12 py-6 border-t border-gray-200">
            <div class="flex flex-col md:flex-row justify-between items-center">
                <div class="mb-4 md:mb-0">
                    <p class="text-gray-600">© 2025 Abdul Raqiib Basiran & Iqraq Education</p>
                </div>
                <div class="flex space-x-4">
                    <a href="https://t.me/iqraqedu" id="telegram-link" class="social-icon text-blue-500 hover:text-blue-700">
                        <i class="fab fa-telegram fa-2x"></i>
                    </a>
                    <a href="https://www.facebook.com/raqiibasiran" id="facebook-link" class="social-icon text-blue-600 hover:text-blue-800">
                        <i class="fab fa-facebook fa-2x"></i>
                    </a>
                    <a href="https://www.tiktok.com/@raqiibasiran" id="tiktok-link" class="social-icon text-gray-800 hover:text-black">
                        <i class="fab fa-tiktok fa-2x"></i>
                    </a>
                    <a href="https://wasap.my/+601172706678" id="whatsapp-link" class="social-icon text-green-500 hover:text-green-700">
                        <i class="fab fa-whatsapp fa-2x"></i>
                    </a>
                    <a href="mailto:raqiibasiran@gmail.com" id="contact-link" class="social-icon text-purple-500 hover:text-purple-700">
                        <i class="fas fa-envelope fa-2x"></i>
                    </a>
                </div>
            </div>
        </footer>
    </div>
    
    <!-- Add/Edit Zikir Modal -->
    <div id="zikir-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
        <div class="bg-white rounded-lg shadow-xl p-6 w-full max-w-md">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-xl font-bold text-blue-800" id="zikir-modal-title">Tambah Zikir Baru</h3>
                <button id="close-zikir-modal" class="text-gray-500 hover:text-gray-700">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>
            
            <div class="mb-4">
                <label class="block text-gray-700 mb-2" for="zikir-name">Nama Zikir</label>
                <input type="text" id="zikir-name" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Contoh: Subhanallah">
            </div>
            
            <div class="mb-4">
                <label class="block text-gray-700 mb-2" for="zikir-content">Kandungan Zikir</label>
                <textarea id="zikir-content" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 arabic-text" rows="4" placeholder="Masukkan teks zikir di sini..."></textarea>
            </div>
            
            <input type="hidden" id="edit-zikir-id" value="">
            
            <div class="flex justify-end">
                <button id="save-zikir-btn" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg">

    <!-- Set Target Modal -->
    <div id="set-target-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
        <div class="bg-white rounded-lg shadow-xl p-6 w-full max-w-md">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-xl font-bold text-blue-800">Set Bilangan Target</h3>
                <button id="close-target-modal" class="text-gray-500 hover:text-gray-700">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>
            
            <div class="mb-4">
                <label class="block text-gray-700 mb-2" for="target-input">Bilangan Target</label>
                <input type="number" id="target-input" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" value="33" min="1">
            </div>
            
            <div class="flex justify-between">
                <button id="target-preset-33" class="px-3 py-1 bg-blue-100 hover:bg-blue-200 text-blue-800 rounded-lg">33</button>
                <button id="target-preset-99" class="px-3 py-1 bg-blue-100 hover:bg-blue-200 text-blue-800 rounded-lg">99</button>
                <button id="target-preset-100" class="px-3 py-1 bg-blue-100 hover:bg-blue-200 text-blue-800 rounded-lg">100</button>
                <button id="target-preset-1000" class="px-3 py-1 bg-blue-100 hover:bg-blue-200 text-blue-800 rounded-lg">1000</button>
            </div>
            
            <div class="flex justify-end mt-4">
                <button id="save-target-btn" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg">
                    <i class="fas fa-save mr-2"></i> Simpan

    <!-- Social Links Modal -->
    <div id="social-links-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
        <div class="bg-white rounded-lg shadow-xl p-6 w-full max-w-md">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-xl font-bold text-blue-800">Edit Pautan Media Sosial</h3>
                <button id="close-social-modal" class="text-gray-500 hover:text-gray-700">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>
            
            <div class="mb-4">
                <label class="block text-gray-700 mb-2" for="telegram-url">Telegram</label>
                <input type="text" id="telegram-url" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="https://t.me/yourusername">
            </div>
            
            <div class="mb-4">
                <label class="block text-gray-700 mb-2" for="facebook-url">Facebook</label>
                <input type="text" id="facebook-url" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="https://facebook.com/yourpage">
            </div>
            
            <div class="mb-4">
                <label class="block text-gray-700 mb-2" for="tiktok-url">TikTok</label>
                <input type="text" id="tiktok-url" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="https://tiktok.com/@yourusername">
            </div>
            
            <div class="mb-4">
                <label class="block text-gray-700 mb-2" for="whatsapp-url">WhatsApp</label>
                <input type="text" id="whatsapp-url" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="https://wa.me/60123456789">
            </div>
            
            <div class="mb-4">
                <label class="block text-gray-700 mb-2" for="contact-url">Hubungi Saya</label>
                <input type="text" id="contact-url" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="mailto:your@email.com">
            </div>
            
            <div class="flex justify-end">
                <button id="save-social-btn" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg">
                    <i class="fas fa-save mr-2"></i> Simpan
                </button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Initialize variables
            let currentZikir = null;
            let counter = 0;
            let targetCount = 33;
            let zikirList = [];
            let zikirHistory = [];
            let isRTL = true;
            let isZikirListVisible = true;
            let isEditMode = false;
            
            // Default zikir list
            const defaultZikirs = [
                {
                    id: 1,
                    name: "Subhanallah",
                    content: "سُبْحَانَ اللهِ",
                    rtl: true
                },
                {
                    id: 2,
                    name: "Alhamdulillah",
                    content: "اَلْحَمْدُ لِلَّهِ",
                    rtl: true
                },
                {
                    id: 3,
                    name: "Allahu Akbar",
                    content: "اللهُ أَكْبَرُ",
                    rtl: true
                },
                {
                    id: 4,
                    name: "La ilaha illallah",
                    content: "لَا إِلَٰهَ إِلَّا اللهُ",
                    rtl: true
                },
                {
                    id: 5,
                    name: "Astaghfirullah",
                    content: "أَسْتَغْفِرُ اللهَ",
                    rtl: true
                }
            ];
            
            // Load data from localStorage or use defaults
            function loadData() {
                const savedZikirs = localStorage.getItem('zikirList');
                const savedHistory = localStorage.getItem('zikirHistory');
                const savedSocialLinks = localStorage.getItem('socialLinks');
                const savedListVisibility = localStorage.getItem('zikirListVisible');
                
                zikirList = savedZikirs ? JSON.parse(savedZikirs) : defaultZikirs;
                zikirHistory = savedHistory ? JSON.parse(savedHistory) : [];
                
                if (savedListVisibility !== null) {
                    isZikirListVisible = savedListVisibility === 'true';
                    updateZikirListVisibility();
                }
                
                if (savedSocialLinks) {
                    const links = JSON.parse(savedSocialLinks);
                    document.getElementById('telegram-url').value = links.telegram || '';
                    document.getElementById('facebook-url').value = links.facebook || '';
                    document.getElementById('tiktok-url').value = links.tiktok || '';
                    document.getElementById('whatsapp-url').value = links.whatsapp || '';
                    document.getElementById('contact-url').value = links.contact || '';
                    
                    updateSocialLinks(links);
                }
                
                renderZikirList();
                renderHistoryList();
            }
            
            // Save data to localStorage
            function saveData() {
                localStorage.setItem('zikirList', JSON.stringify(zikirList));
                localStorage.setItem('zikirHistory', JSON.stringify(zikirHistory));
                localStorage.setItem('zikirListVisible', isZikirListVisible);
            }
            
            // Toggle zikir list visibility
            function toggleZikirList() {
                isZikirListVisible = !isZikirListVisible;
                updateZikirListVisibility();
                saveData();
            }
            
            // Update zikir list visibility
            function updateZikirListVisibility() {
                const zikirListEl = document.getElementById('zikir-list');
                const toggleBtn = document.getElementById('toggle-zikir-list');
                
                if (isZikirListVisible) {
                    zikirListEl.classList.remove('hidden');
                    toggleBtn.innerHTML = '<i class="fas fa-eye-slash mr-1"></i> <span id="toggle-text">Sorok</span>';
                } else {
                    zikirListEl.classList.add('hidden');
                    toggleBtn.innerHTML = '<i class="fas fa-eye mr-1"></i> <span id="toggle-text">Papar</span>';
                }
            }
            
            // Render zikir list
            function renderZikirList() {
                const zikirListEl = document.getElementById('zikir-list');
                zikirListEl.innerHTML = '';
                
                if (zikirList.length === 0) {
                    zikirListEl.innerHTML = `
                        <div class="text-center py-8 text-gray-500">
                            <i class="fas fa-pray text-5xl mb-3"></i>
                            <p>Tiada zikir dalam senarai</p>
                        </div>
                    `;
                    return;
                }
                
                zikirList.forEach(zikir => {
                    const zikirItem = document.createElement('div');
                    zikirItem.className = `zikir-item p-3 border-b border-gray-200 ${currentZikir && currentZikir.id === zikir.id ? 'zikir-active' : ''}`;
                    zikirItem.innerHTML = `
                        <div>
                            <div class="flex justify-between items-center mb-1">
                                <h3 class="font-medium">${zikir.name}</h3>
                            </div>
                            <div class="action-buttons">
                                <button class="action-button select-zikir-btn bg-blue-100 hover:bg-blue-200 text-blue-800" data-id="${zikir.id}">
                                    <i class="fas fa-check-circle mr-1"></i> Pilih
                                </button>
                                <button class="action-button edit-zikir-btn bg-yellow-100 hover:bg-yellow-200 text-yellow-800" data-id="${zikir.id}">
                                    <i class="fas fa-edit mr-1"></i> Edit
                                </button>
                                <button class="action-button delete-zikir-btn bg-red-100 hover:bg-red-200 text-red-800" data-id="${zikir.id}">
                                    <i class="fas fa-trash-alt mr-1"></i> Padam
                                </button>
                            </div>
                            <p class="arabic-text text-gray-600 mt-2 ${zikir.rtl ? 'rtl' : 'ltr'}">${zikir.content}</p>
                        </div>
                    `;
                    zikirListEl.appendChild(zikirItem);
                });
                
                // Add event listeners to buttons
                document.querySelectorAll('.select-zikir-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const zikirId = parseInt(this.getAttribute('data-id'));
                        selectZikir(zikirId);
                    });
                });
                
                document.querySelectorAll('.edit-zikir-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const zikirId = parseInt(this.getAttribute('data-id'));
                        editZikir(zikirId);
                    });
                });
                
                document.querySelectorAll('.delete-zikir-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const zikirId = parseInt(this.getAttribute('data-id'));
                        deleteZikir(zikirId);
                    });
                });
            }
            
            // Select a zikir
            function selectZikir(zikirId) {
                currentZikir = zikirList.find(z => z.id === zikirId);
                
                if (currentZikir) {
                    document.getElementById('current-zikir-title').textContent = currentZikir.name;
                    const zikirTextEl = document.getElementById('zikir-text');
                    zikirTextEl.innerHTML = `<p class="${currentZikir.rtl ? 'rtl' : 'ltr'}">${currentZikir.content}</p>`;
                    zikirTextEl.className = `arabic-text text-center text-2xl mb-4 min-h-[100px] flex items-center justify-center ${currentZikir.rtl ? 'rtl' : 'ltr'}`;
                    
                    isRTL = currentZikir.rtl;
                    
                    document.getElementById('start-zikir-btn').disabled = false;
                    resetCounter();
                    renderZikirList();
                }
            }
            
            // Edit a zikir
            function editZikir(zikirId) {
                const zikir = zikirList.find(z => z.id === zikirId);
                
                if (zikir) {
                    isEditMode = true;
                    document.getElementById('zikir-modal-title').textContent = 'Edit Zikir';
                    document.getElementById('zikir-name').value = zikir.name;
                    document.getElementById('zikir-content').value = zikir.content;
                    document.getElementById('edit-zikir-id').value = zikir.id;
                    document.getElementById('zikir-modal').classList.remove('hidden');
                }
            }
            
            // Delete a zikir
            function deleteZikir(zikirId) {
                if (confirm('Adakah anda pasti ingin memadamkan zikir ini?')) {
                    zikirList = zikirList.filter(z => z.id !== zikirId);
                    
                    if (currentZikir && currentZikir.id === zikirId) {
                        currentZikir = null;
                        document.getElementById('current-zikir-title').textContent = 'Pilih Zikir';
                        document.getElementById('zikir-text').innerHTML = '<p class="text-gray-500">Sila pilih zikir dari senarai</p>';
                        document.getElementById('start-zikir-btn').disabled = true;
                        resetCounter();
                    }
                    
                    saveData();
                    renderZikirList();
                }
            }
            
            // Save zikir (add or edit)
            function saveZikir() {
                const zikirName = document.getElementById('zikir-name').value.trim();
                const zikirContent = document.getElementById('zikir-content').value.trim();
                const editId = document.getElementById('edit-zikir-id').value;
                
                if (!zikirName || !zikirContent) {
                    alert('Sila masukkan nama dan kandungan zikir');
                    return;
                }
                
                if (isEditMode && editId) {
                    // Edit existing zikir
                    const zikirIndex = zikirList.findIndex(z => z.id === parseInt(editId));
                    
                    if (zikirIndex !== -1) {
                        zikirList[zikirIndex].name = zikirName;
                        zikirList[zikirIndex].content = zikirContent;
                        
                        // Update current zikir if it's the one being edited
                        if (currentZikir && currentZikir.id === parseInt(editId)) {
                            currentZikir = zikirList[zikirIndex];
                            document.getElementById('current-zikir-title').textContent = currentZikir.name;
                            const zikirTextEl = document.getElementById('zikir-text');
                            zikirTextEl.innerHTML = `<p class="${currentZikir.rtl ? 'rtl' : 'ltr'}">${currentZikir.content}</p>`;
                        }
                    }
                } else {
                    // Add new zikir
                    const newId = zikirList.length > 0 ? Math.max(...zikirList.map(z => z.id)) + 1 : 1;
                    
                    const newZikir = {
                        id: newId,
                        name: zikirName,
                        content: zikirContent,
                        rtl: true
                    };
                    
                    zikirList.push(newZikir);
                }
                
                saveData();
                renderZikirList();
                
                // Close modal and reset form
                closeZikirModal();
            }
            
            // Close zikir modal and reset form
            function closeZikirModal() {
                document.getElementById('zikir-modal').classList.add('hidden');
                document.getElementById('zikir-name').value = '';
                document.getElementById('zikir-content').value = '';
                document.getElementById('edit-zikir-id').value = '';
                isEditMode = false;
                document.getElementById('zikir-modal-title').textContent = 'Tambah Zikir Baru';
            }
            
            // Reset counter
            function resetCounter() {
                counter = 0;
                document.getElementById('counter').textContent = counter;
                document.getElementById('tasbih-btn').classList.remove('completed');
                document.getElementById('tasbih-btn').disabled = false;
            }
            
            // Start zikir session
            function startZikir() {
                if (!currentZikir) return;
                
                resetCounter();
                document.getElementById('tasbih-btn').disabled = false;
                document.getElementById('start-zikir-btn').innerHTML = '<i class="fas fa-sync-alt mr-2"></i> Mula Semula';
            }
            
            // Increment counter
            function incrementCounter() {
                if (!currentZikir) return;
                
                counter++;
                document.getElementById('counter').textContent = counter;
                document.getElementById('tasbih-btn').classList.add('pulse');
                
                setTimeout(() => {
                    document.getElementById('tasbih-btn').classList.remove('pulse');
                }, 500);
                
                // Check if target reached
                if (counter >= targetCount) {
                    document.getElementById('tasbih-btn').classList.add('completed');
                    document.getElementById('tasbih-btn').disabled = true;
                    
                    // Vibrate if supported
                    if (navigator.vibrate) {
                        navigator.vibrate([200, 100, 200]);
                    }
                    
                    // Add to history
                    addToHistory();
                }
            }
            
            // Decrement counter (undo)
            function decrementCounter() {
                if (counter > 0) {
                    counter--;
                    document.getElementById('counter').textContent = counter;
                    
                    if (counter < targetCount) {
                        document.getElementById('tasbih-btn').classList.remove('completed');
                        document.getElementById('tasbih-btn').disabled = false;
                    }
                }
            }
            
            // Set target count
            function setTargetCount() {
                const targetInput = document.getElementById('target-input').value;
                const newTarget = parseInt(targetInput);
                
                if (isNaN(newTarget) || newTarget < 1) {
                    alert('Sila masukkan bilangan yang sah');
                    return;
                }
                
                targetCount = newTarget;
                document.getElementById('target-counter').textContent = targetCount;
                
                // Reset counter if needed
                if (counter >= targetCount) {
                    resetCounter();
                }
                
                document.getElementById('set-target-modal').classList.add('hidden');
            }
            
            // Add to history
            function addToHistory() {
                if (!currentZikir) return;
                
                const now = new Date();
                const historyItem = {
                    id: Date.now(),
                    zikirId: currentZikir.id,
                    zikirName: currentZikir.name,
                    zikirContent: currentZikir.content,
                    count: counter,
                    timestamp: now.toISOString()
                };
                
                zikirHistory.push(historyItem);
                saveData();
                
                if (document.getElementById('history-tab').classList.contains('block')) {
                    renderHistoryList();
                }
            }
            
            // Render history list
            function renderHistoryList() {
                const historyListEl = document.getElementById('history-list');
                const noHistoryEl = document.getElementById('no-history');
                
                historyListEl.innerHTML = '';
                
                if (zikirHistory.length === 0) {
                    noHistoryEl.classList.remove('hidden');
                } else {
                    noHistoryEl.classList.add('hidden');
                    
                    // Sort history by timestamp (newest first)
                    const sortedHistory = [...zikirHistory].sort((a, b) => 
                        new Date(b.timestamp) - new Date(a.timestamp)
                    );
                    
                    sortedHistory.forEach(item => {
                        const date = new Date(item.timestamp);
                        const formattedDate = `${date.toLocaleDateString()} ${date.toLocaleTimeString()}`;
                        
                        const historyRow = document.createElement('tr');
                        historyRow.className = 'history-item border-b border-gray-200 hover:bg-blue-50';
                        historyRow.innerHTML = `
                            <td class="py-3 px-4">${formattedDate}</td>
                            <td class="py-3 px-4">${item.zikirName}</td>
                            <td class="py-3 px-4">${item.count}</td>
                            <td class="py-3 px-4">
                                <button class="delete-history-btn text-red-500 hover:text-red-700" data-id="${item.id}">
                                    <i class="fas fa-trash-alt"></i>
                                </button>
                            </td>
                        `;
                        historyListEl.appendChild(historyRow);
                    });
                    
                    // Add event listeners to delete buttons
                    document.querySelectorAll('.delete-history-btn').forEach(btn => {
                        btn.addEventListener('click', function() {
                            const historyId = parseInt(this.getAttribute('data-id'));
                            deleteHistoryItem(historyId);
                        });
                    });
                }
            }
            
            // Delete history item
            function deleteHistoryItem(historyId) {
                zikirHistory = zikirHistory.filter(h => h.id !== historyId);
                saveData();
                renderHistoryList();
            }
            
            // Clear all history
            function clearHistory() {
                if (confirm('Adakah anda pasti ingin memadamkan semua sejarah zikir?')) {
                    zikirHistory = [];
                    saveData();
                    renderHistoryList();
                }
            }
            
            // Export history to Excel (CSV)
            function exportHistory() {
                if (zikirHistory.length === 0) {
                    alert('Tiada sejarah zikir untuk dieksport');
                    return;
                }
                
                let csvContent = "data:text/csv;charset=utf-8,";
                csvContent += "Tarikh,Masa,Zikir,Bilangan\n";
                
                zikirHistory.forEach(item => {
                    const date = new Date(item.timestamp);
                    const formattedDate = date.toLocaleDateString();
                    const formattedTime = date.toLocaleTimeString();
                    
                    csvContent += `${formattedDate},${formattedTime},"${item.zikirName}",${item.count}\n`;
                });
                
                const encodedUri = encodeURI(csvContent);
                const link = document.createElement("a");
                link.setAttribute("href", encodedUri);
                link.setAttribute("download", "sejarah_zikir.csv");
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }
            
            // Save social links
            function saveSocialLinks() {
                const links = {
                    telegram: document.getElementById('telegram-url').value.trim(),
                    facebook: document.getElementById('facebook-url').value.trim(),
                    tiktok: document.getElementById('tiktok-url').value.trim(),
                    whatsapp: document.getElementById('whatsapp-url').value.trim(),
                    contact: document.getElementById('contact-url').value.trim()
                };
                
                localStorage.setItem('socialLinks', JSON.stringify(links));
                updateSocialLinks(links);
                document.getElementById('social-links-modal').classList.add('hidden');
            }
            
            // Update social links in footer
            function updateSocialLinks(links) {
                document.getElementById('telegram-link').href = links.telegram || '#';
                document.getElementById('facebook-link').href = links.facebook || '#';
                document.getElementById('tiktok-link').href = links.tiktok || '#';
                document.getElementById('whatsapp-link').href = links.whatsapp || '#';
                document.getElementById('contact-link').href = links.contact || '#';
            }
            
            // Search zikir
            function searchZikir() {
                const searchTerm = document.getElementById('search-zikir').value.toLowerCase();
                const zikirItems = document.querySelectorAll('.zikir-item');
                
                zikirItems.forEach(item => {
                    const zikirName = item.querySelector('h3').textContent.toLowerCase();
                    if (zikirName.includes(searchTerm)) {
                        item.style.display = 'block';
                    } else {
                        item.style.display = 'none';
                    }
                });
            }
            
            // Tab switching
            function switchTab(tabId) {
                const zikirTab = document.getElementById('zikir-tab');
                const historyTab = document.getElementById('history-tab');
                const zikirTabBtn = document.getElementById('tab-zikir');
                const historyTabBtn = document.getElementById('tab-history');
                
                if (tabId === 'zikir') {
                    zikirTab.classList.remove('hidden');
                    zikirTab.classList.add('grid');
                    historyTab.classList.add('hidden');
                    zikirTabBtn.classList.add('tab-active');
                    historyTabBtn.classList.remove('tab-active');
                } else {
                    zikirTab.classList.add('hidden');
                    zikirTab.classList.remove('grid');
                    historyTab.classList.remove('hidden');
                    zikirTabBtn.classList.remove('tab-active');
                    historyTabBtn.classList.add('tab-active');
                    renderHistoryList();
                }
            }
            
            // Initialize the app
            loadData();
            document.getElementById('target-counter').textContent = targetCount;
            document.getElementById('start-zikir-btn').disabled = true;
            
            // Event listeners
            document.getElementById('toggle-zikir-list').addEventListener('click', toggleZikirList);
            
            document.getElementById('add-zikir-btn').addEventListener('click', () => {
                isEditMode = false;
                document.getElementById('zikir-modal-title').textContent = 'Tambah Zikir Baru';
                document.getElementById('zikir-name').value = '';
                document.getElementById('zikir-content').value = '';
                document.getElementById('edit-zikir-id').value = '';
                document.getElementById('zikir-modal').classList.remove('hidden');
            });
            
            document.getElementById('close-zikir-modal').addEventListener('click', closeZikirModal);
            document.getElementById('save-zikir-btn').addEventListener('click', saveZikir);
            
            document.getElementById('set-target-btn').addEventListener('click', () => {
                document.getElementById('set-target-modal').classList.remove('hidden');
            });
            
            document.getElementById('close-target-modal').addEventListener('click', () => {
                document.getElementById('set-target-modal').classList.add('hidden');
            });
            
            document.getElementById('save-target-btn').addEventListener('click', setTargetCount);
            
            document.getElementById('target-preset-33').addEventListener('click', () => {
                document.getElementById('target-input').value = 33;
            });
            
            document.getElementById('target-preset-99').addEventListener('click', () => {
                document.getElementById('target-input').value = 99;
            });
            
            document.getElementById('target-preset-100').addEventListener('click', () => {
                document.getElementById('target-input').value = 100;
            });
            
            document.getElementById('target-preset-1000').addEventListener('click', () => {
                document.getElementById('target-input').value = 1000;
            });
            
            document.getElementById('start-zikir-btn').addEventListener('click', startZikir);
            document.getElementById('tasbih-btn').addEventListener('click', incrementCounter);
            document.getElementById('undo-btn').addEventListener('click', decrementCounter);
            
            document.getElementById('tab-zikir').addEventListener('click', () => switchTab('zikir'));
            document.getElementById('tab-history').addEventListener('click', () => switchTab('history'));
            
            document.getElementById('export-history-btn').addEventListener('click', exportHistory);
            document.getElementById('clear-history-btn').addEventListener('click', clearHistory);
            
            document.getElementById('search-zikir').addEventListener('input', searchZikir);
            
            // Social links
            document.getElementById('contact-link').addEventListener('click', (e) => {
                e.preventDefault();
                document.getElementById('social-links-modal').classList.remove('hidden');
            });
            
            document.getElementById('close-social-modal').addEventListener('click', () => {
                document.getElementById('social-links-modal').classList.add('hidden');
            });
            
            document.getElementById('save-social-btn').addEventListener('click', saveSocialLinks);
            
            // Handle keyboard shortcuts
            document.addEventListener('keydown', (e) => {
                if (e.code === 'Space' && !document.getElementById('tasbih-btn').disabled) {
                    incrementCounter();
                    e.preventDefault(); // Prevent page scrolling
                } else if (e.code === 'Backspace' || e.code === 'Delete') {
                    decrementCounter();
                    e.preventDefault();
                }
            });
        });
    </script>
